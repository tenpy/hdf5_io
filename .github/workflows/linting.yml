name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          # Lint tools only — do not build the C++ extension (needs libhdf5-dev).
          python -m pip install --upgrade pip
          python -m pip install ruff flake8 flake8-rst-docstrings sphinx-lint
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Lint python code
        run: |
          # TeNPy-synced trees (src/python2, src/python3) are excluded in pyproject.toml.
          ruff check tenpy_hdf5 tests scripts

      - name: Lint docs
        run: |
          flake8 --select RST
          sphinx-lint -e all doc --max-line-length=1000 -d default-role

      - name: Run autoformatter
        run: |
          ruff format --diff tenpy_hdf5 tests scripts

      - name: clang-format
        run: |
          mapfile -t files < <(
            find include src/cpp pybind tests/ctest \
              \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.cc' \) \
              -print | sort
          )
          if ((${#files[@]} == 0)); then
            echo "No C/C++ sources found for clang-format"
            exit 1
          fi
          clang-format --dry-run --Werror "${files[@]}"
