name: Run Pytest

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # TeNPy v1-synced pure-Python reference (no C++ build).
  reference-python3:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PY_COLORS: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy h5py

      - name: Run reference Python tests
        working-directory: src/python3
        run: |
          # Local ``import hdf5_io`` as TeNPy sync expects; do not install tenpy-hdf5.
          PYTHONPATH=. pytest test_hdf5.py -vv

  # Installable C++ / nanobind package + cross-compat with the reference module.
  cpp-package:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PY_COLORS: 1
      BUILD_TESTING: "ON"
    defaults:
      run:
        # micromamba activates the env for every `run` step
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: >-
            python=${{ matrix.python-version }}
          cache-environment: true

      - name: Build and install
        run: |
          # conda-forge hdf5 + h5py share one libhdf5; HIDs from h5py are then
          # valid in the C++ extension (pip h5py wheels vendor a different HDF5).
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run package pytest
        run: |
          pytest -vv

      - name: Run ctest
        run: |
          ctest --test-dir build --output-on-failure

  # Python-free core library (lasyten-style consumer path).
  cpp-core-only:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: >-
            python=3.12
          cache-environment: true

      - name: Configure, build, and ctest (no Python bindings)
        run: |
          cmake -S . -B build-core \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENPY_HDF5_BUILD_PYTHON=OFF \
            -DBUILD_TESTING=ON
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure
