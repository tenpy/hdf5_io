name: Wheels (cp312-abi3)

# Build Stable ABI wheels and publish to (Test)PyPI.
#
# Triggers:
#   - workflow_dispatch (manual; optional TestPyPI publish)
#   - release published → PyPI
#
# Trusted Publishing (OIDC) — configure on https://pypi.org / https://test.pypi.org:
#   Owner: tenpy  |  Project: tenpy-hdf5  |  Repo: hdf5_io  |  Workflow: publish.yml

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish built wheels + sdist to TestPyPI
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  abi3-wheel:
    name: abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: >-
            python=3.14
          cache-environment: true

      - name: Build cp312-abi3 wheel
        run: |
          pip install --upgrade pip build
          pip install --no-build-isolation -e .
          python -m build --wheel --no-isolation -o wheelhouse \
            -C cmake.build-type=Release \
            -C cmake.define.BUILD_TESTING=OFF

      - name: Check abi3 wheel tag and _core.abi3 extension
        run: |
          python scripts/check_abi3_wheel.py wheelhouse/*.whl
          python - <<'PY'
          import pathlib, zipfile, sys
          wheels = list(pathlib.Path('wheelhouse').glob('*.whl'))
          assert wheels, 'no wheels'
          with zipfile.ZipFile(wheels[0]) as zf:
              cores = [n for n in zf.namelist() if '_core.abi3.' in n]
          print('abi3 extension members:', cores)
          if not cores:
              sys.exit('missing _core.abi3.* inside wheel')
          PY

      - name: Smoke-import from the wheel
        run: |
          pip install --no-deps --force-reinstall wheelhouse/*.whl
          SMOKE_DIR="${RUNNER_TEMP:-/tmp}/tenpy_hdf5_wheel_smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          python -c "import tenpy_hdf5 as t; print(t.__file__); import tenpy_hdf5._core as c; print(c.__file__); assert 'abi3' in c.__file__; assert t.REPR_LIST == 'list'"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: abi3-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  cibuildwheel-linux:
    name: cibuildwheel (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1

      - name: Check abi3 wheels
        run: python3 scripts/check_abi3_wheel.py wheelhouse/*.whl

      - name: Upload cibuildwheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-linux
          path: wheelhouse/*.whl
          retention-days: 14
          if-no-files-found: error

  cibuildwheel-macos:
    name: cibuildwheel (macos ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'

      - name: Check abi3 wheels
        run: python3 scripts/check_abi3_wheel.py wheelhouse/*.whl

      - name: Upload cibuildwheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to (Test)PyPI
    needs: [abi3-wheel, cibuildwheel-linux, cibuildwheel-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build / twine
        run: python -m pip install --upgrade pip build twine

      - name: Download cibuildwheel wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibuildwheel-*
          merge-multiple: true
          path: dist/

      - name: Build sdist
        run: |
          python -m build --sdist --outdir dist/
          python -m twine check --strict dist/*

      - name: Publish to TestPyPI
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.publish_testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
